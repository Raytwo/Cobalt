[package]
name = "gamedata"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
skyline = { workspace = true }
unity-nx = { workspace = true }

mods = { path = "../mods" }
camino = { workspace = true }
# Gamedata diffing
astra_formats = { workspace = true }
astra-derive = { workspace = true }
differ = { workspace = true }
ordered-float = { version = "3.0", default-features = false }
quick-xml = "0.29.0"
cobalt_xml_merge = { workspace = true } # No field merging, but fast and stable
strum = "0.25.0"
strum_macros = "0.25.2"
lazysimd = { workspace = true }


