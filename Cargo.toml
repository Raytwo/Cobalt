[package]
name = "ozone"
version = "0.1.0"
edition = "2021"
authors = ["Shadów", "blujay", "Raytwo"]

[package.metadata.skyline]
titleid = "0100A6301214E000" # Fire Emblem Engage
custom-npdm = "packaged/exefs/main.npdm"
package-resources = [
    { local = "packaged/romfs/cache.json", package = "engage/cobalt/cache.lut" },
]

[workspace]
resolver = "2"
members = [
    ".",
    "crates/cobalt",
    "crates/gamedata",
    "crates/loader",
    "crates/mods",
    "crates/updater",
    "ozone_macro",
]

[workspace.dependencies]
unity-nx = { git = "https://github.com/DivineDragonFanClub/unity2", tag = "0.1.0" }
engage-il2cpp = { git = "https://github.com/DivineDragonFanClub/engage-il2cpp", tag = "0.1.0", default-features = false }
astra_formats = { git = "https://github.com/thane98/astra-formats", default-features = false }
astra-derive = { git = "https://github.com/thane98/Astra" }
horizon-svc = { git = "https://github.com/skyline-rs/horizon-svc" }
lazysimd = "0.1"
localize = { git = "https://github.com/DivineDragonFanClub/localize" }
addressables-rs = { git = "https://github.com/Raytwo/addressables-rs", version = "0.2" }
cobapi = { git = "https://github.com/DivineDragonFanClub/cobapi", tag = "0.1.0" }
cobalt_xml_merge = { git = "https://github.com/DivineDragonFanClub/cobalt_xml_merge", rev = "8204258" }
differ = { git = "https://github.com/Level0r0s/differ" }
ips = { git = "https://github.com/Nifyr/ips32" }

skyline = "0.6"
camino = "1.0.7"
thiserror = "1.0.30"
rawzip = "0.4"
flate2 = { version = "1", default-features = false }
semver = "1.0.27"
serde = "1.0"

[dependencies]
ozone_macro = { path = "./ozone_macro" }
cobalt = { path = "crates/cobalt" }
updater = { path = "crates/updater" }
gamedata = { path = "crates/gamedata" }
loader = { path = "crates/loader" }
mods = { path = "crates/mods" }
skyline = { workspace = true }
unity-nx = { workspace = true }
horizon-svc = { workspace = true }
camino = { workspace = true }
semver = { workspace = true }
ips = { workspace = true }
log = "0.4"
multi_log = "0.1.2"

[patch.crates-io]
getrandom = { git = "https://github.com/skyline-rs/getrandom" }
native-tls = { git = "https://github.com/skyline-rs/rust-native-tls", branch = "switch"  }

[build-dependencies]
ex-build = { path = "../ex-build" }

[lib]
crate-type = ["cdylib"]

# sometimes got compile errors I can't really explain
# these settings work for me most of the time
[profile.dev]
# opt-level 0 breaks sometimes for me lol. 1 less rare. 3 is also comparable in terms of compile speed, but should be slower in theory.
opt-level = 1 
# no idea if this breaks stuff more likely, turning it off just in case
debug = false
debug-assertions = false
overflow-checks = false
# lto-thin, reduces compile times. "off" breaks.
lto = false
panic = "abort"
# faster for me, dunno if necessary, has some build errors where this was off *sometimes*.
incremental = true

[profile.release]
panic = "abort"
lto = "thin"
strip = true
incremental = true

# incremental = true